<style>
:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-behavior:smooth;scroll-padding-top:90px}
body{margin:0;font-family:Inter,system-ui,sans-serif;background:radial-gradient(ellipse at 15% 0,var(--bd) 0,transparent 55%),radial-gradient(ellipse at 95% 35%,var(--tint) 0,transparent 55%),#fff;background-attachment:fixed;color:#0f172a;min-height:100vh;overflow-x:hidden}
.glass{background:rgba(255,255,255,.88);border:1px solid var(--bd);box-shadow:0 4px 24px color-mix(in srgb,var(--p2) 14%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:20px}
.grad{background:linear-gradient(90deg,var(--p),var(--p3));-webkit-background-clip:text;background-clip:text;color:transparent}
.btn{background:linear-gradient(90deg,var(--p),var(--p2));color:#fff;font-weight:700;padding:.7rem 1.5rem;border-radius:999px;border:0;cursor:pointer;box-shadow:0 0 24px color-mix(in srgb,var(--p3) 40%,transparent);transition:transform .2s,box-shadow .2s}
.btn:hover{transform:translateY(-2px) scale(1.03);box-shadow:0 0 34px color-mix(in srgb,var(--p3) 55%,transparent)}
.btn2{border:1px solid var(--p2);color:var(--p);font-weight:600;padding:.7rem 1.5rem;border-radius:999px;background:transparent;cursor:pointer;transition:.2s}
.btn2:hover{background:var(--tint);transform:translateY(-2px)}
.nav a{cursor:pointer;color:#334155;font-size:.9rem;padding:.4rem .7rem;border-radius:10px;transition:.2s}
.nav a:hover{color:var(--tx);background:var(--tint)}
.lang button{padding:.3rem .55rem;border-radius:10px;border:1px solid transparent;background:transparent;cursor:pointer;font-size:.8rem;color:#334155;transition:.2s}
.lang button.on{border-color:var(--p2);background:var(--tint);color:var(--tx)}
.pill{padding:.45rem 1rem;border-radius:999px;border:1px solid var(--bd2);background:#fff;color:var(--tx);cursor:pointer;font-weight:600;transition:.2s}
.pill:hover{border-color:var(--p2)}.pill.on{background:linear-gradient(90deg,var(--p),var(--p2));color:#fff;border-color:transparent}
.opt{text-align:left;padding:.85rem 1rem;border-radius:14px;border:1px solid var(--bd);background:#fff;color:#0f172a;cursor:pointer;transition:.2s}
.opt:hover:not(:disabled){border-color:var(--p2);transform:translateX(4px)}
.opt.ok{background:#bbf7d0;border-color:#10b981}.opt.no{background:#fecdd3;border-color:#f43f5e}
.lv{cursor:pointer;text-align:left;padding:1.4rem;color:inherit;transition:transform .25s,box-shadow .25s,border-color .25s}
.lv:hover{transform:translateY(-6px);box-shadow:0 0 36px var(--c);border-color:var(--c)}
.spk{background:var(--tint);border:0;border-radius:50%;width:36px;height:36px;cursor:pointer;transition:.2s}
.spk:hover{background:var(--bd2);transform:scale(1.15)}
.fl{perspective:900px}.fi{position:relative;height:220px;transition:transform .6s;transform-style:preserve-3d;cursor:pointer}.fi.on{transform:rotateY(180deg)}
.fi>div{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.6rem}.fi .bk{transform:rotateY(180deg)}
.float{animation:fl 5s ease-in-out infinite}@keyframes fl{50%{transform:translateY(-14px)}}
.logo{filter:drop-shadow(0 0 8px var(--p3));animation:pl 2.4s ease-in-out infinite}@keyframes pl{50%{filter:drop-shadow(0 0 16px var(--p4));transform:scale(1.07)}}
.rv{animation:rv .45s both}@keyframes rv{from{opacity:0;transform:translateY(12px)}}
#drawer{transition:max-height .35s ease,opacity .35s;max-height:0;opacity:0;overflow:hidden}#drawer.open{max-height:420px;opacity:1}
input,textarea{width:100%;background:#fff;border:1px solid var(--bd2);border-radius:12px;padding:.7rem .9rem;color:#0f172a;margin-top:.7rem;font:inherit}
input:focus,textarea:focus,button:focus-visible{outline:2px solid var(--p2);outline-offset:2px}
.text-slate-300{color:#334155!important}.text-slate-400{color:#475569!important}.text-slate-500{color:#64748b!important}.text-emerald-400{color:#15803d!important}.text-rose-400{color:#be123c!important}
.hdr{position:relative;overflow:hidden;background:linear-gradient(100deg,var(--p),var(--p2) 55%,var(--p3));border-radius:22px;box-shadow:0 10px 32px color-mix(in srgb,var(--p2) 45%,transparent);transition:background .4s}
.hdr::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.28) 50%,transparent 65%);transform:translateX(-100%);animation:sw 5s ease-in-out infinite;pointer-events:none}@keyframes sw{60%,100%{transform:translateX(100%)}}
.hdr>*{position:relative;z-index:1}
.lgb{display:grid;place-items:center;width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.2);box-shadow:inset 0 0 0 1px rgba(255,255,255,.55),0 0 18px rgba(255,255,255,.4)}
.hdr .nav a{color:#fff}.hdr .nav a:hover{background:rgba(255,255,255,.22);color:#fff}
.hdr .lang button{color:#fff}.hdr .lang button.on{background:#fff;color:var(--p);border-color:#fff}
.hdr .spk{background:rgba(255,255,255,.25);color:#fff}
.hdr{background:linear-gradient(110deg,var(--p),var(--p2),var(--p3),var(--p2),var(--p));background-size:300% 100%;animation:flow 14s ease infinite}@keyframes flow{50%{background-position:100% 0}}
.hdr::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.2) 1px,transparent 1.5px);background-size:14px 14px;opacity:.55;pointer-events:none}
.hdr .nav a{display:inline-flex;align-items:center;gap:.4rem;font-weight:600;background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.3);margin:0 2px}
.hdr .nav a i{font-style:normal;font-size:.95rem}
.hdr .nav a:hover{transform:translateY(-2px);background:rgba(255,255,255,.3);box-shadow:0 6px 16px rgba(0,0,0,.18)}
#drawer a{margin:3px 0}
.hdr .lang{background:rgba(0,0,0,.2);padding:3px;border-radius:14px;gap:2px}
.hdr .lang button{display:flex;align-items:center;gap:.35rem;font-weight:700}
.cc{font-style:normal;font-size:.62rem;font-weight:800;padding:1px 5px;border-radius:6px;background:rgba(255,255,255,.28)}
.hdr .lang button.on .cc{background:var(--tint);color:var(--p)}
.lgb{position:relative;isolation:isolate;background:var(--p)}
.lgb::before{content:"";position:absolute;inset:-3px;border-radius:50%;z-index:-1;background:conic-gradient(#fde047,transparent 35%,#fff 60%,transparent 85%,#fde047);animation:spin 4s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:560px){.hdr .lang button{font-size:0}.hdr .lang .cc{font-size:.72rem}}
.aib{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:60;display:flex;align-items:center;gap:.5rem;padding:.8rem 1.1rem;border-radius:999px;border:0;cursor:pointer;color:#fff;font-size:.95rem;background:linear-gradient(90deg,var(--p),var(--p2));box-shadow:0 10px 28px color-mix(in srgb,var(--p2) 50%,transparent);animation:bob 3s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-5px)}}
.aip{position:fixed;right:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:60;width:min(410px,calc(100vw - 32px));height:min(580px,calc(100vh - 130px));display:none;flex-direction:column;background:#fff;border:1px solid var(--bd);border-radius:22px;box-shadow:0 20px 60px rgba(0,0,0,.25);overflow:hidden}.aip.open{display:flex}
.aih{background:linear-gradient(100deg,var(--p),var(--p2));color:#fff;padding:.8rem 1rem;display:flex;align-items:center;gap:.6rem}
.aih .spk{background:rgba(255,255,255,.25);width:32px;height:32px;color:#fff}
.aim{flex:1;overflow-y:auto;padding:.9rem;display:flex;flex-direction:column;gap:.6rem;background:linear-gradient(var(--tint),#fff)}
.mb{max-width:90%;padding:.6rem .85rem;border-radius:16px;font-size:.92rem;line-height:1.45;overflow-wrap:anywhere}
.mb.u{align-self:flex-end;background:linear-gradient(90deg,var(--p),var(--p2));color:#fff;border-bottom-right-radius:4px}
.mb.b{align-self:flex-start;background:#fff;border:1px solid var(--bd);color:#0f172a;border-bottom-left-radius:4px}
.aic{display:flex;gap:.4rem;overflow-x:auto;padding:.5rem .7rem;border-top:1px solid var(--bd);background:#fff}
.aic button{white-space:nowrap;font-size:.75rem;padding:.35rem .7rem;border-radius:999px;border:1px solid var(--bd2);background:#fff;color:var(--tx);cursor:pointer}
.aif{display:flex;gap:.5rem;padding:.6rem;border-top:1px solid var(--bd);background:#fff}.aif input{margin:0;flex:1}.aif .btn{padding:.6rem 1rem}
.dots span{display:inline-block;animation:dt 1s infinite}.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}@keyframes dt{50%{opacity:.2}}
@property --p{syntax:'<color>';inherits:true;initial-value:#15803d}@property --p2{syntax:'<color>';inherits:true;initial-value:#16a34a}@property --p3{syntax:'<color>';inherits:true;initial-value:#22c55e}@property --p4{syntax:'<color>';inherits:true;initial-value:#4ade80}
@property --bd{syntax:'<color>';inherits:true;initial-value:#bbf7d0}@property --bd2{syntax:'<color>';inherits:true;initial-value:#86efac}@property --tint{syntax:'<color>';inherits:true;initial-value:#dcfce7}@property --tx{syntax:'<color>';inherits:true;initial-value:#14532d}
:root{transition:--p .7s,--p2 .7s,--p3 .7s,--p4 .7s,--bd .7s,--bd2 .7s,--tint .7s,--tx .7s}
#pc{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}
#glow{position:fixed;left:0;top:0;width:440px;height:440px;margin:-220px 0 0 -220px;background:radial-gradient(circle,color-mix(in srgb,var(--p3) 28%,transparent),transparent 65%);pointer-events:none;z-index:-1;transition:transform .18s ease-out}
@media(hover:none){#glow{display:none}}
.hdr{animation:flow 14s ease infinite,hd .9s cubic-bezier(.2,.8,.2,1) both}@keyframes hd{from{transform:translateY(-130%);opacity:0}}
.grad{background-image:linear-gradient(90deg,var(--p),var(--p3),var(--p));background-size:200% 100%;animation:gs 6s linear infinite}@keyframes gs{to{background-position:200% 0}}
.rev{opacity:0;transform:translateY(32px) scale(.97);transition:opacity .8s cubic-bezier(.2,.8,.2,1),transform .8s cubic-bezier(.2,.8,.2,1)}.rev.in{opacity:1;transform:none}
.btn{position:relative;overflow:hidden}.btn::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-20deg);transition:left .6s}.btn:hover::after{left:130%}
#panel.stg .grid>*{animation:rv .55s both;animation-delay:calc(var(--i,0)*45ms)}
#panel .grid>.glass{transition:transform .25s,box-shadow .25s}#panel .grid>.glass:hover{transform:translateY(-4px);box-shadow:0 12px 30px color-mix(in srgb,var(--p2) 25%,transparent)}
.opt.ok{animation:pop .45s}.opt.no{animation:shake .4s}@keyframes pop{40%{transform:scale(1.04)}}@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.cf{position:fixed;inset:0;pointer-events:none;z-index:90;overflow:hidden}.cf i{position:absolute;top:-14px;width:8px;height:14px;border-radius:2px;animation:cfall linear forwards}@keyframes cfall{to{transform:translate(var(--x),108vh) rotate(720deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<canvas id="pc"></canvas><div id="glow"></div>
<header class="sticky z-50 px-3 pt-3" style="top:env(safe-area-inset-top,0px)">
 <div class="hdr max-w-6xl mx-auto px-4 py-2">
  <div class="flex items-center justify-between gap-3">
   <a class="flex items-center gap-2 cursor-pointer" onclick="go('home')">
    <span class="lgb"><svg viewBox="0 0 48 48" class="w-9 h-9 logo" aria-hidden="true"><path d="M6 18l7 6 11-14 11 14 7-6-3 18H9z" fill="rgba(255,255,255,.18)" stroke="#fff" stroke-width="2.5" stroke-linejoin="round"/><circle cx="24" cy="6" r="2.8" fill="#fde047"/><circle cx="6" cy="18" r="2" fill="#fde047"/><circle cx="42" cy="18" r="2" fill="#fde047"/><text x="24" y="32" text-anchor="middle" font-size="13" font-weight="800" fill="#fff" font-family="Inter,sans-serif">ME</text></svg></span>
    <span class="font-extrabold tracking-wide text-white text-xl leading-none">MAKHSUM<br><span class="text-xs tracking-[.35em] text-yellow-200">ENGLISH</span></span>
   </a>
   <nav class="nav hidden lg:flex items-center" id="nav"></nav>
   <div class="flex items-center gap-2">
    <div class="lang flex" id="lang">
     <button data-l="tg"><i class="cc">TJ</i>Тоҷикӣ</button><button data-l="ru"><i class="cc">RU</i>Русский</button><button data-l="en"><i class="cc">EN</i>English</button>
    </div>
    <button class="lg:hidden spk" id="burger" aria-label="menu">☰</button>
   </div>
  </div>
  <nav class="nav flex flex-col lg:hidden" id="drawer"></nav>
 </div>
</header>

<main class="max-w-6xl mx-auto px-4">
 <section id="home" class="py-16 md:py-24 grid md:grid-cols-2 gap-10 items-center">
  <div class="rv">
   <h1 class="text-4xl md:text-6xl font-extrabold leading-tight grad" id="h1"></h1>
   <p class="mt-5 text-slate-300 text-lg max-w-md" id="hp"></p>
   <div class="mt-8 flex flex-wrap gap-3"><button class="btn" id="c1" onclick="go('practice:0')"></button><button class="btn2" id="c2" onclick="go('levels')"></button><button class="btn2" id="c3" onclick="go('test')"></button></div>
   <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 mt-8" id="stats"></div>
  </div>
  <div class="relative h-72 md:h-96 flex items-center justify-center">
   <div class="absolute w-64 h-64 rounded-full blur-3xl opacity-50" style="background:linear-gradient(135deg,var(--p4),var(--p2))"></div>
   <div id="wod" class="glass float px-8 py-6 text-center relative"></div><button class="spk mt-3" onclick="say('Hello! Welcome to Makhsum English')" aria-label="sound">🔊</button></div>
   <div class="glass float absolute top-4 right-2 px-4 py-2 text-sm" style="animation-delay:-1.5s">A1 → C2</div>
   <div class="glass float absolute bottom-4 left-2 px-4 py-2 text-sm" style="animation-delay:-3s">🇹🇯 🇷🇺 🇬🇧</div>
  </div>
 </section>

 <section id="levels" class="py-12">
  <h2 class="text-3xl font-extrabold" id="lt"></h2><p class="text-slate-400 mt-2" id="lp"></p>
  <div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-5 mt-8" id="lvgrid"></div>
 </section>

 <section id="practice" class="py-12">
  <div class="glass p-5 md:p-8">
   <div class="flex flex-wrap gap-2 mb-4" id="lvpills"></div>
   <div class="flex flex-wrap gap-2 mb-6" id="tabs"></div>
   <div id="panel" class="rv"></div>
  </div>
 </section>


 <section id="test" class="py-12">
  <div class="glass p-5 md:p-8">
   <h2 class="text-3xl font-extrabold" id="tt"></h2><p class="text-slate-400 mt-2" id="tp"></p>
   <div id="tbox" class="mt-6"></div>
  </div>
 </section>
</main>
<footer class="text-center text-slate-500 text-sm py-8">© 2026 MAKHSUM ENGLISH</footer>

<button id="aib" class="aib" onclick="aiToggle()" aria-label="MAKHSUM AI"><span>🤖</span><b>MAKHSUM AI</b></button>
<div id="aip" class="aip" role="dialog" aria-label="MAKHSUM AI">
 <div class="aih"><span class="text-2xl">🤖</span><div class="flex-1 leading-tight"><b>MAKHSUM AI</b><div class="text-xs opacity-90" id="ait"></div></div><button class="spk" id="aid" onclick="aiMode()" aria-label="mode" title="Fast / Deep">⚡</button><button class="spk" onclick="aiClear()" aria-label="clear">🗑</button><button class="spk" onclick="aiToggle(false)" aria-label="close">✕</button></div>
 <div class="aim" id="aim"></div>
 <div class="aic" id="aic"></div>
 <div class="aif"><input id="aii" autocomplete="off"><button class="btn" onclick="aiSend()" aria-label="send">➤</button></div>
</div>

g:`Mixed Conditionals (1)|If + Past Perfect, would + V: натиҷаи ҳозира|If + Past Perfect, would + V: результат сейчас|Past condition, present result|If I had slept well, I would not feel tired now.|Агар хуб мехобидам, ҳоло хаста намешудам.|Если бы я выспался, я бы сейчас не устал.;

g:`Conditional Inversion (Had I)|Инверсия дар шарти 3 бе if|Инверсия в условных 3-го типа без if|Omit if, invert with had|Had I known, I would have helped.|Агар медонистам, кӯмак мекардам.|Если бы я знал, я бы помог.;

Wh-Cleft Sentences|What ... барои таъкиди амал|What ... для выделения действия|Emphasise action with what|What I need is a hot tea.|Он чизе, ки ба ман лозим аст, чойи гарм аст.|Что мне нужно, так это горячий чай.;
Absolute Participle Clauses|Ибораи мустақил бо мубтадои худ|Причастный оборот со своим подлежащим|Participle clause with its own subject|The work finished, we went home.|Кор тамом шуда, мо ба хона рафтем.|Работа закончена, мы пошли домой.;
Subjunctive|Шакли асосии феъл баъд аз талаб|Основная форма глагола после требований|Base verb after demands or proposals|They insist that he be present.|Онҳо талаб доранд, ки ӯ ҳозир бошад.|Они настаивают, чтобы он присутствовал.;

Must have / Can't have|Хулосаи қатъӣ дар бораи гузашта|Уверенный вывод о прошлом|Strong deductions about the past|He can't have stolen it.|Ӯ онро дуздида наметавонист.|Он не мог это украсть.;

{t:['Шиносоӣ ва нақшаҳои истироҳат','Знакомство и планы на выходные','Meeting and Weekend Plans'],l:`Anisa|Hello, Farruh! How are you today?|Салом, Фаррух! Имрӯз ҳолат чӣ тавр аст?|Привет, Фаррух! Как у тебя дела сегодня?

{t:['Саёҳат ва таҷрибаи сафар','Путешествия и впечатления от поездок','Travel and Holiday Experiences'],l:`Jasur|Hey Madina! I heard you just got back from your summer vacation. Where did you go?|Ҳой Мадина! Шунидам, ки ту тоза аз таътили тобистона баргаштӣ. Куҷо рафта будӣ?|Привет, Мадина! Я слышал, ты только что вернулась из летнего отпуска. Куда ты ездила?
Madina|Hi Jasur! Yes, I spent two weeks in Turkey with my cousins. It was an incredible trip!|Салом Ҷасур! Ҳа, ман ду ҳафта дар Туркия бо додару хоҳарони амакбачаам будам. Ин сафари аҷиб буд!|Привет, Жасур! Да, я провела две недели в Турции с двоюродными братьями и сёстрами. Это была невероятная поездка!
Jasur|Wow, that sounds amazing! Which cities did you visit?|Вай, ин аҷоиб садо медиҳад! Кадом шаҳрҳоро дидӣ?|Ого, звучит потрясающе! Какие города ты посетила?
Madina|First, we stayed in Istanbul for four days to explore the historical sights like the Hagia Sophia and the Grand Bazaar. After that, we flew to Antalya to relax on the beach and enjoy the clear blue water.|Аввал мо чор рӯз дар Истанбул мондем, то ҷойҳои таърихиро, ба монанди Аё София ва Бозори Калон, бубинем. Баъд ба Анталия парвоз кардем, то дар соҳил истироҳат кунем ва аз оби софи кабуд лаззат барем.|Сначала мы четыре дня жили в Стамбуле и осматривали исторические места, например Айя-Софию и Гранд-базар. Потом мы полетели в Анталью, чтобы отдохнуть на пляже и насладиться чистой голубой водой.
Jasur|Did you try any traditional Turkish dishes while you were there?|Оё ҳангоми дар он ҷо буданат таомҳои суннатии туркиро чашидӣ?|Ты пробовала традиционные турецкие блюда, пока была там?
Madina|Absolutely! We ate various types of kebabs, baklava, and drank a lot of Turkish tea. The food was delicious, though a bit sweet for my taste!|Албатта! Мо намудҳои гуногуни кабоб ва бақлава хӯрдем ва чойи туркии бисёр нӯшидем. Хӯрок лазиз буд, гарчанде барои табъи ман каме ширин!|Конечно! Мы ели разные виды кебаба, пахлаву и пили много турецкого чая. Еда была вкусной, хотя немного сладковатой на мой вкус!
Jasur|I really want to visit Turkey next summer. Do you have any recommendations for a first-time traveler?|Ман дар ҳақиқат мехоҳам тобистони оянда ба Туркия равам. Барои сайёҳи бори аввал тавсияе дорӣ?|Я очень хочу поехать в Турцию следующим летом. Есть ли у тебя советы для того, кто едет впервые?
Madina|I suggest booking your historical tours in advance because the lines can be very long. Also, do not forget to learn a few basic words in Turkish. The locals really appreciate it when you try to speak their language.|Маслиҳат медиҳам, ки турҳои таърихиро пешакӣ фармоиш диҳӣ, чунки навбатҳо хеле дароз шуда метавонанд. Инчунин чанд калимаи асосиро бо забони туркӣ омӯз. Маҳаллиён воқеан қадр мекунанд, вақте ту бо забони онҳо гап заданӣ мешавӣ.|Советую заранее бронировать исторические туры, потому что очереди бывают очень длинными. И не забудь выучить несколько основных слов по-турецки. Местные очень ценят, когда ты пытаешься говорить на их языке.
Jasur|That is great advice, thanks Madina! I will definitely keep that in mind when planning my trip.|Маслиҳати олӣ аст, ташаккур Мадина! Ҳангоми нақшакашии сафар ҳатман инро ба назар мегирам.|Отличный совет, спасибо, Мадина! Я обязательно учту это, когда буду планировать поездку.`},
{t:['Мансаб, зеҳни сунъӣ ва ояндаи кор','Карьера, ИИ и будущее работы','Career, AI, and the Future of Work'],l:`Rustam|Hi Nilufar. Have you been following the recent news regarding artificial intelligence and its potential impact on employment?|Салом Нилуфар. Оё хабарҳои охиринро дар бораи зеҳни сунъӣ ва таъсири эҳтимолии он ба шуғл пайгирӣ мекунӣ?|Привет, Нилуфар. Ты следишь за последними новостями об искусственном интеллекте и его возможном влиянии на занятость?
Nilufar|Yes, Rustam. It is actually a hot topic at my workplace. Many people are worried that automation and generative AI models might replace a significant portion of white-collar jobs in the next decade.|Ҳа, Рустам. Ин дар ҷои кори ман мавзӯи доғ аст. Бисёриҳо хавотиранд, ки автоматизатсия ва моделҳои зеҳни сунъии генеративӣ метавонанд дар даҳсолаи оянда қисми зиёди ҷойҳои кори донишмандонро иваз кунанд.|Да, Рустам. Это сейчас горячая тема на моей работе. Многие переживают, что автоматизация и генеративные модели ИИ могут в следующем десятилетии заменить значительную часть офисных профессий.
Rustam|I see both sides of the argument. While certain repetitive and administrative tasks will undoubtedly be automated, I believe AI will also create entirely new industries and job roles that we cannot even imagine right now.|Ман ҳар ду тарафи баҳсро мебинам. Гарчанде баъзе вазифаҳои такроршаванда ва маъмурӣ бешубҳа автоматӣ мешаванд, боварӣ дорам, ки зеҳни сунъӣ соҳаҳо ва касбҳои тамоман навро низ ба вуҷуд меорад, ки мо ҳоло тасаввур ҳам карда наметавонем.|Я вижу обе стороны спора. Хотя некоторые повторяющиеся и административные задачи несомненно будут автоматизированы, я считаю, что ИИ также создаст совершенно новые отрасли и профессии, которые мы пока даже не можем представить.
Nilufar|That is true, but the primary concern is the transition period. Adapting to these rapid changes requires continuous upskilling. Not everyone has immediate access to training programs or the resources to pivot their careers quickly.|Ин дуруст аст, аммо нигаронии асосӣ давраи гузариш аст. Мутобиқ шудан ба ин тағйироти босуръат такмили пайвастаи малакаро талаб мекунад. На ҳама ба барномаҳои омӯзишӣ ё захираҳо барои зуд иваз кардани самти касб дастрасӣ доранд.|Это правда, но главная проблема в переходном периоде. Адаптация к таким быстрым переменам требует постоянного повышения квалификации. Не у всех есть быстрый доступ к программам обучения или ресурсы, чтобы быстро сменить профессию.
Rustam|Exactly. That is why educational institutions and governments need to collaborate. They should design training programs focused on soft skills, critical thinking, and emotional intelligence, areas where humans naturally excel over machines.|Айнан. Барои ҳамин муассисаҳои таълимӣ ва ҳукуматҳо бояд ҳамкорӣ кунанд. Онҳо бояд барномаҳои омӯзишие таҳия кунанд, ки ба малакаҳои нарм, тафаккури танқидӣ ва зеҳни эҳсосӣ равона шудаанд, яъне соҳаҳое, ки дар онҳо инсон ба таври табиӣ аз мошин болотар аст.|Именно. Поэтому учебные заведения и правительства должны сотрудничать. Им нужно разработать программы обучения, сосредоточенные на гибких навыках, критическом мышлении и эмоциональном интеллекте, то есть в тех областях, где человек от природы превосходит машины.

addEventListener('pointermove',e=>{if(e.pointerType==='mouse')$('#glow').style.transform=`translate(${e.clientX}px,${e.clientY}px)`});
(()=>{const cv=$('#pc'),cx=cv.getContext('2d');if(matchMedia('(prefers-reduced-motion:reduce)').matches){cv.remove();return}
let W,H,f=0,col='#22c55e';const Q=[],rs=()=>{W=cv.width=innerWidth;H=cv.height=innerHeight};rs();addEventListener('resize',rs);
for(let i=0;i<46;i++)Q.push({x:Math.random()*W,y:Math.random()*H,r:1.5+Math.random()*3,vx:(Math.random()-.5)*.3,vy:-.15-Math.random()*.35});
(function L(){if(!document.hidden){if(f++%90==0)col=getComputedStyle(document.documentElement).getPropertyValue('--p3').trim()||col;cx.clearRect(0,0,W,H);cx.fillStyle=cx.strokeStyle=col;

for(let i=0;i<Q.length;i++)for(let j=i+1;j<Q.length;j++){const a=Q[i],b=Q[j],d=Math.hypot(a.x-b.x,a.y-b.y);if(d<120){cx.globalAlpha=.16*(1-d/120);cx.beginPath();cx.moveTo(a.x,a.y);cx.lineTo(b.x,b.y);cx.stroke()}}}
requestAnimationFrame(L)})()})();
